<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIL AI Assistant</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #00e5ff;
    margin-bottom: 5px;
}

#status {
    text-align: center;
    color: #9ca3af;
    margin: 12px;
}

#chat {
    height: 65vh;
    overflow-y: auto;
    background: #1e293b;
    border-radius: 14px;
    padding: 12px;
}

.message {
    padding: 13px;
    margin: 10px 0;
    border-radius: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    line-height: 1.5;
}

.user {
    background: #075985;
    text-align: right;
}

.bot {
    background: #334155;
    text-align: left;
}

.controls {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border-radius: 9px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #00bcd4;
    color: #001018;
    font-weight: bold;
    font-size: 15px;
}

button:disabled {
    opacity: 0.5;
}

#stopButton {
    background: #ef4444;
    color: white;
}
</style></head><body><h1>🤖 KIL AI</h1>
<div id="status">सर्वर से जुड़ रहा है...</div><div id="chat">
    <div class="message bot">
        नमस्ते! मैं KIL AI हूँ। आप मुझसे चैट और आवाज़ के जरिए बात कर सकते हैं।
    </div>
</div><div class="controls">
    <input id="message" type="text"
           placeholder="अपना संदेश लिखें..."><button id="send" onclick="sendMessage()">भेजें</button>

</div><div class="controls">
    <button onclick="startVoice()">🎤 बोलें</button>
    <button id="stopButton" onclick="stopSpeaking()">⏹️ आवाज़ रोकें</button>
</div><script>

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

let sessionId = localStorage.getItem("kil_session");

if (!sessionId) {
    sessionId = "kil-" + Date.now();
    localStorage.setItem("kil_session", sessionId);
}

// चैट में संदेश दिखाना
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = String(text);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// सर्वर की स्थिति जाँचना
async function checkServer() {
    try {
        const response = await fetch("/api/health");

        if (!response.ok) {
            throw new Error("Server error");
        }

        statusText.textContent = "🟢 KIL AI ऑनलाइन है";

    } catch (error) {
        statusText.textContent = "🔴 सर्वर कनेक्शन नहीं है";
    }
}

// KIL की आवाज़ रोकना
function stopSpeaking() {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
}

// KIL से बात करना
async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    sendButton.disabled = true;

    stopSpeaking();

    statusText.textContent = "KIL जवाब तैयार कर रहा है...";

    try {

        const response = await fetch("/api/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text,
                session_id: sessionId
            })
        });

        const raw = await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error("सर्वर का जवाब पढ़ा नहीं जा सका: " + raw);
        }

        if (!response.ok) {
            const detail = data.detail || data.error || raw;

            throw new Error(
                typeof detail === "string"
                    ? detail
                    : JSON.stringify(detail)
            );
        }

        let reply = data.reply;

        if (reply === undefined || reply === null) {
            reply = data.response || data.answer || data.message;
        }

        if (reply === undefined || reply === null) {
            throw new Error("AI का जवाब नहीं मिला: " +
                JSON.stringify(data));
        }

        addMessage(reply, "bot");

        if (data.session_id) {
            sessionId = data.session_id;
            localStorage.setItem("kil_session", sessionId);
        }

        // KIL का आवाज़ में जवाब
        if ("speechSynthesis" in window) {

            stopSpeaking();

            const speech = new SpeechSynthesisUtterance(
                String(reply)
            );

            speech.lang = "hi-IN";
            speech.rate = 1;
            speech.pitch = 1;

            window.speechSynthesis.speak(speech);
        }

        statusText.textContent = "🟢 KIL AI ऑनलाइन है";

    } catch (error) {

        addMessage("त्रुटि: " + error.message, "bot");

        statusText.textContent = "🔴 जवाब मिलने में समस्या";
    }

    sendButton.disabled = false;
}

// Enter दबाकर संदेश भेजना
input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

// आवाज़ से संदेश लिखना
function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        alert("इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है।");
        return;
    }

    const recognition = new Recognition();

    recognition.lang = "hi-IN";
    recognition.interimResults = false;

    recognition.onstart = function() {
        statusText.textContent = "🎤 आपकी आवाज़ सुन रहा हूँ...";
    };

    recognition.onresult = function(event) {

        const voiceText = event.results[0][0].transcript;

        input.value = voiceText;

        sendMessage();
    };

    recognition.onerror = function() {
        statusText.textContent = "आवाज़ पहचानने में समस्या हुई।";
    };

    recognition.onend = function() {
        if (!sendButton.disabled) {
            statusText.textContent = "🟢 KIL AI ऑनलाइन है";
        }
    };

    recognition.start();
}

// पेज खुलने पर सर्वर चेक करना
checkServer();

</script></body>
</html>
