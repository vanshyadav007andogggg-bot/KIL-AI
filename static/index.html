<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIL AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #00e5ff;
}

#status {
    text-align: center;
    color: #9ca3af;
    margin: 12px;
}

#chat {
    height: 65vh;
    overflow-y: auto;
    background: #1e293b;
    border-radius: 12px;
    padding: 12px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user { background: #075985; }
.bot { background: #334155; }

.controls {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #00bcd4;
    color: #001018;
    font-weight: bold;
    font-size: 15px;
}
</style>
</head>

<body>

<h1>🤖 KIL AI</h1>
<div id="status">सर्वर से जुड़ रहा है...</div>

<div id="chat">
    <div class="message bot">
        नमस्ते! मैं KIL AI हूँ। आप मुझसे बात कर सकते हैं।
    </div>
</div>

<div class="controls">
    <input id="message" placeholder="अपना संदेश लिखें...">
    <button id="send" onclick="sendMessage()">भेजें</button>
    <button onclick="startVoice()">🎤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

let sessionId = localStorage.getItem("kil_session");

if (!sessionId) {
    sessionId = "kil-" + Date.now();
    localStorage.setItem("kil_session", sessionId);
}

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = String(text);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function checkServer() {
    try {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error("Server error");
        statusText.textContent = "🟢 KIL AI ऑनलाइन है";
    } catch (error) {
        statusText.textContent = "🔴 सर्वर से कनेक्शन नहीं हुआ";
    }
}

async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    sendButton.disabled = true;
    statusText.textContent = "KIL जवाब तैयार कर रहा है...";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                session_id: sessionId
            })
        });

        const raw = await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error("सर्वर ने सही JSON जवाब नहीं दिया: " + raw);
        }

        if (!response.ok) {
            const detail = data.detail || data.error || raw;
            throw new Error(
                typeof detail === "string"
                    ? detail
                    : JSON.stringify(detail)
            );
        }

        let reply = data.reply;

        if (reply === undefined || reply === null) {
            reply = data.response || data.answer || data.message;
        }

        if (reply === undefined || reply === null) {
            throw new Error("सर्वर के जवाब में reply नहीं मिला: " +
                JSON.stringify(data));
        }

        addMessage(reply, "bot");

        if (data.session_id) {
            sessionId = data.session_id;
            localStorage.setItem("kil_session", sessionId);
        }

        if ("speechSynthesis" in window) {
            const speech = new SpeechSynthesisUtterance(String(reply));
            speech.lang = "hi-IN";
            speechSynthesis.speak(speech);
        }

        statusText.textContent = "🟢 KIL AI ऑनलाइन है";

    } catch (error) {
        addMessage("त्रुटि: " + error.message, "bot");
        statusText.textContent = "🔴 जवाब मिलने में समस्या";
    }

    sendButton.disabled = false;
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function startVoice() {
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        alert("इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है।");
        return;
    }

    const recognition = new Recognition();
    recognition.lang = "hi-IN";
    recognition.start();

    recognition.onresult = function(event) {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.onerror = function() {
        alert("आवाज़ पहचानने में समस्या हुई।");
    };
}

checkServer();
</script>

</body>
</html>
